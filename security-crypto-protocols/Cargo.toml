[package]
edition = "2021"
name = "sasp"
version = "0.1.0"

[dependencies]
# --- MLS control plane (provided helper uses these) ---
openmls = { version = "0.9.0-rc.1", features = [
    "libcrux-provider",
], git = "https://github.com/openmls/openmls" }
openmls_basic_credential = { version = "0.6.0-rc.1", git = "https://github.com/openmls/openmls" }
openmls_libcrux_crypto = { version = "0.4.0-rc.1", git = "https://github.com/openmls/openmls" }

# --- Individual libcrux sub-crates for key-derivation / transport crypto ---
libcrux-aead = "0.0.9"
libcrux-hkdf = "0.0.8"
libcrux-hmac = "0.0.8"
libcrux-secrets = "0.0.6"
libcrux-sha2 = "0.0.8"
libcrux-traits = "0.0.8"

# --- Async networking + serialization ---
serde = { version = "1", features = ["derive"] }
thiserror = "2" # helper for typed errors
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
] }

[lib]
name = "sasp"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"
